[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "testscope"
version = "0.4.0"
description = "Run only the tests a change can affect. Built for AI coding agents and CI."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Ar9av" }]
dependencies = ["pytest>=7"]
keywords = ["pytest", "test impact analysis", "regression test selection", "ai agents", "claude code", "ci"]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
ai = ["anthropic>=1"]

[project.urls]
Homepage = "https://github.com/Ar9av/testscope"
Issues = "https://github.com/Ar9av/testscope/issues"

[project.entry-points.pytest11]
testscope = "testscope.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/testscope"]
